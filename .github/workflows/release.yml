name: Release

# Triggered by a version tag (vX.Y.Z) or manually. Produces a DRAFT GitHub
# Release with verified artefacts; nothing is published publicly by this
# workflow. The `release` environment can be given required reviewers in the
# repository settings to add a manual approval gate. TestFlight upload runs
# only when explicitly requested AND App Store Connect credentials exist.
# Public App Store / Google Play submission is never automated here.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload the signed IPA to TestFlight (requires App Store Connect secrets)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          V=$(grep -oP '^config/version="\K[^"]+' project.godot)
          T="${GITHUB_REF_NAME#v}"
          echo "project=$V tag=$T"
          test "$V" = "$T" || { echo "Tag v$T does not match project version $V"; exit 1; }
          grep -q "## \[$V\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $V"; exit 1; }

  tests:
    needs: validate-version
    uses: ./.github/workflows/ci.yml

  android:
    needs: tests
    uses: ./.github/workflows/android-build.yml
    secrets: inherit

  ios:
    needs: tests
    uses: ./.github/workflows/ios-build.yml
    secrets: inherit
    # ios-build.yml's publish-release job declares contents: write; it is skipped
    # when called from here, but a called workflow may not request more than this.
    permissions:
      contents: write

  testflight:
    needs: ios
    if: github.event_name == 'workflow_dispatch' && inputs.testflight && needs.ios.outputs.signed == 'true'
    runs-on: macos-26
    environment: release
    env:
      HAS_ASC: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
    steps:
      - name: Require App Store Connect credentials
        if: env.HAS_ASC != 'true'
        run: |
          echo "TestFlight upload requested but App Store Connect API secrets are missing." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: luma-ios-*
          path: dist
          merge-multiple: true
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8
          IPA=$(find dist -name "*.ipa" | head -n 1)
          test -n "$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8
          echo "Uploaded $(basename "$IPA") to App Store Connect for TestFlight processing." >> "$GITHUB_STEP_SUMMARY"

  draft-release:
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: Release notes from commits since the previous tag
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}${GITHUB_REF_NAME}"
          {
            echo "## LUMA ${GITHUB_REF_NAME}"
            echo ""
            echo "Commits: \`${RANGE}\`"
            echo ""
            git log --no-merges --pretty='- %s (%h)' "$RANGE"
            echo ""
            echo "Artefacts were built and verified by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo "Unsigned iOS archives are diagnostic only and cannot be installed."
          } > release-notes.md
          find dist -type f | sort
      - name: Create draft release (not public)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: true
          body_path: release-notes.md
          files: |
            dist/**/*.apk
            dist/**/*.aab
            dist/**/*.ipa
            dist/**/SHA256SUMS.txt
          fail_on_unmatched_files: false
